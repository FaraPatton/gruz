<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#101523">
<title>Архив Drive — Аналитика</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/bb8.css?v=1">
<link rel="stylesheet" href="css/style.css?v=31">
<style>
  body.analytics-page {
    min-height: 100vh;
    background:
      radial-gradient(circle at 18% 0%, rgba(57,217,138,.16), transparent 28%),
      radial-gradient(circle at 88% 18%, rgba(79,124,255,.14), transparent 28%),
      #0d111d;
    color: #f8fbff;
  }
  .analytics-shell {
    width: min(1120px, calc(100% - 28px));
    margin: 0 auto;
    min-height: 100vh;
    padding: 22px 0 34px;
    display: flex;
    flex-direction: column;
  }
  .analytics-topbar {
    display: grid;
    place-items: center;
    gap: 12px;
    margin: 4px auto 18px;
    width: min(560px, 100%);
  }
  .analytics-back-btn {
    justify-self: start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(57,217,138,.32);
    border-radius: 999px;
    padding: 8px 13px;
    background: rgba(57,217,138,.08);
    color: #dfffee;
    font-size: 12px;
    font-weight: 750;
    text-decoration: none;
    box-shadow: 0 10px 24px rgba(0,0,0,.14);
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .analytics-back-btn:hover {
    transform: translateY(-1px);
    border-color: rgba(57,217,138,.58);
    background: rgba(57,217,138,.13);
  }
  .analytics-brand {
    position: relative;
    width: 100%;
    min-width: 0;
    overflow: hidden;
    text-align: center;
    border: 1px solid rgba(79,124,255,.26);
    border-radius: 22px;
    padding: 20px 18px 18px;
    background:
      radial-gradient(circle at 18% 0%, rgba(57,217,138,.2), transparent 36%),
      radial-gradient(circle at 88% 24%, rgba(255,71,232,.13), transparent 32%),
      linear-gradient(145deg, rgba(20,28,48,.92), rgba(13,17,29,.74));
    box-shadow: 0 22px 54px rgba(0,0,0,.28), 0 0 34px rgba(57,217,138,.08), inset 0 1px 0 rgba(255,255,255,.08);
    animation: analyticsBannerIn .62s cubic-bezier(.2,.8,.2,1) both;
  }
  .analytics-brand:before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent, rgba(255,255,255,.12), transparent);
    transform: translateX(-120%);
    animation: analyticsBannerSweep 5.2s ease-in-out infinite 1s;
  }
  .analytics-brand h1 {
    position: relative;
    margin: 0;
    font-size: clamp(28px, 6vw, 44px);
    line-height: 1.05;
    letter-spacing: 0;
    text-shadow: 0 0 24px rgba(81,210,255,.16);
  }
  .analytics-brand p {
    position: relative;
    margin: 7px 0 0;
    color: rgba(248,251,255,.58);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .16em;
  }
  .analytics-gate {
    flex: 1;
    min-height: 48vh;
    display: grid;
    place-items: center;
  }
  .analytics-gate-card {
    width: min(560px, 100%);
    border: 1px solid rgba(79,124,255,.28);
    border-radius: 18px;
    padding: 24px;
    background: linear-gradient(145deg, rgba(28,35,56,.92), rgba(17,14,27,.96));
    box-shadow: 0 24px 60px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .analytics-gate-card h2 {
    margin: 0 0 10px;
    font-size: 22px;
  }
  .analytics-gate-card p {
    margin: 0 0 16px;
    color: rgba(248,251,255,.64);
    line-height: 1.5;
    font-size: 13px;
  }
  .analytics-gate-card .google-auth-btn {
    width: auto;
    min-width: 210px;
  }
  #analyticsApp {
    display: none;
  }
  #analyticsPanel {
    display: block;
    margin-bottom: 0;
  }
  #analyticsPanel > .dc {
    margin-bottom: 0;
  }
  .analytics-links {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    margin-top: 16px;
    color: rgba(248,251,255,.58);
    font-size: 12px;
  }
  .analytics-links a {
    color: #39d98a;
    text-decoration: none;
  }
  .analytics-slogan {
    margin-top: auto;
  }
  @keyframes analyticsBannerIn {
    from { opacity: 0; transform: translateY(-14px) scale(.98); filter: blur(6px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes analyticsBannerSweep {
    0%, 42% { transform: translateX(-120%); }
    60%, 100% { transform: translateX(120%); }
  }
  @media (max-width: 720px) {
    .analytics-shell {
      width: 100%;
      padding: 14px 6px 28px;
    }
    .analytics-topbar { width: 100%; padding: 0 3px; }
    #analyticsPanel > .dc { padding: 12px 8px !important; border-radius: 14px !important; }
    .analytics-gate-card {
      padding: 18px;
      border-radius: 14px;
    }
  }
</style>
</head>
<body class="analytics-page" data-theme="dark">
<main class="analytics-shell">
  <header class="analytics-topbar">
    <a class="analytics-back-btn" href="index.html">← Вернуться</a>
    <div class="analytics-brand">
      <h1>Архив Drive</h1>
      <p>Аналитика рейсов</p>
    </div>
  </header>

  <section id="analyticsGate" class="analytics-gate">
    <div class="analytics-gate-card">
      <h2>Закрытая аналитика</h2>
      <p id="analyticsGateMsg">Войдите через разрешенный Google-аккаунт. Данные рейсов загрузятся только после проверки email.</p>
      <button class="google-auth-btn" type="button" onclick="analyticsLogin()">
        <span>Открыть аналитику</span>
        <span>→</span>
      </button>
      <div class="analytics-links">
        <a href="index.html">← Документы</a>
        <span>Доступ по whitelist</span>
      </div>
    </div>
  </section>

  <section id="analyticsApp">
    <div id="analyticsPanel">
      <div class="dc">
        <p style="font-size:12px;text-align:center;color:var(--mut);padding:10px">Загружаю аналитику...</p>
      </div>
    </div>
  </section>

  <footer class="app-slogan analytics-slogan" aria-label="Слоган">
    <span>Мы едем туда, где будет лучше</span>
  </footer>
</main>

          <path stroke-width="2" stroke="#282828" fill="#282828" d="M150 65C150 65.39 149.763 65.8656 149.127 66.2893C148.499 66.7083 147.573 67 146.5 67C145.427 67 144.501 66.7083 143.873 66.2893C143.237 65.8656 143 65.39 143 65C143 64.61 143.237 64.1344 143.873 63.7107C144.501 63.2917 145.427 63 146.5 63C147.573 63 148.499 63.2917 149.127 63.7107C149.763 64.1344 150 64.61 150 65Z"></path>
          <rect stroke-width="2" stroke="#282828" fill="#FFFCAB" rx="1" height="7" width="5" y="63" x="187"></rect>
          <rect stroke-width="2" stroke="#282828" fill="#282828" rx="1" height="11" width="4" y="81" x="193"></rect>
          <rect stroke-width="3" stroke="#282828" fill="#DFDFDF" rx="2.5" height="90" width="121" y="1.5" x="6.5"></rect>
          <rect stroke-width="2" stroke="#282828" fill="#DFDFDF" rx="2" height="4" width="6" y="84" x="1"></rect>
        </svg>
      </span>
      <span class="google-truck-tires">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 30 30"><circle stroke-width="3" stroke="#282828" fill="#282828" r="13.5" cy="15" cx="15"></circle><circle fill="#DFDFDF" r="7" cy="15" cx="15"></circle></svg>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 30 30"><circle stroke-width="3" stroke="#282828" fill="#282828" r="13.5" cy="15" cx="15"></circle><circle fill="#DFDFDF" r="7" cy="15" cx="15"></circle></svg>
      </span>
      <span class="google-loader-road"></span>
    </span>
  </div>
  <div class="google-overlay-text">ПЕРЕХОД В GOOGLE</div>
  <div class="google-overlay-sub">АВТОРИЗАЦИЯ...</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/config.js?v=6"></script>
<script src="js/auth.js?v=9"></script>
<script src="js/analytics.js?v=45"></script>
<script src="js/analytics_page.js?v=6"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.log('SW error:', e));
  });
}
</script>
</body>
</html>
