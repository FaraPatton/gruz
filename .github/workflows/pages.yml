name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate runtime config
        env:
          GCLIENT_ID: ${{ secrets.GCLIENT_ID }}
          GAPI_KEY: ${{ secrets.GAPI_KEY }}
          YANDEX_MAPS_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
          ARCHIVE_ROOT: ${{ secrets.ARCHIVE_ROOT }}
          ROUTE_BASE_ADDRESS: ${{ secrets.ROUTE_BASE_ADDRESS }}
          ANALYTICS_ALLOWED_EMAILS: ${{ secrets.ANALYTICS_ALLOWED_EMAILS }}
          EXECUTOR_MARKERS: ${{ secrets.EXECUTOR_MARKERS }}
          EXECUTOR_NAME: ${{ secrets.EXECUTOR_NAME }}
          EXECUTOR_SHORT_NAME: ${{ secrets.EXECUTOR_SHORT_NAME }}
          EXECUTOR_INN: ${{ secrets.EXECUTOR_INN }}
          EXECUTOR_OGRN: ${{ secrets.EXECUTOR_OGRN }}
          EXECUTOR_ADDRESS: ${{ secrets.EXECUTOR_ADDRESS }}
          EXECUTOR_PHONE: ${{ secrets.EXECUTOR_PHONE }}
          EXECUTOR_BANK: ${{ secrets.EXECUTOR_BANK }}
          EXECUTOR_BIK: ${{ secrets.EXECUTOR_BIK }}
          EXECUTOR_CORR_ACCOUNT: ${{ secrets.EXECUTOR_CORR_ACCOUNT }}
          EXECUTOR_ACCOUNT: ${{ secrets.EXECUTOR_ACCOUNT }}
          EMAIL_SUBJECT: ${{ secrets.EMAIL_SUBJECT }}
          EMAIL_BODY: ${{ secrets.EMAIL_BODY }}
          SIGN_EMAIL_SUBJECT: ${{ secrets.SIGN_EMAIL_SUBJECT }}
          SIGN_EMAIL_BODY: ${{ secrets.SIGN_EMAIL_BODY }}
          EMAIL_DRIVE_FOLDER_ID: ${{ secrets.EMAIL_DRIVE_FOLDER_ID }}
          STAMP_FILE_ID: ${{ secrets.STAMP_FILE_ID }}
        run: |
          node scripts/generate-config.mjs

      - name: Prepare deploy cache version
        run: |
          node scripts/prepare-deploy.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
