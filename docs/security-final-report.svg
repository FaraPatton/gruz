<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">GRUZ - финальная сводка по безопасности</title>
  <desc id="desc">Одностраничный отчет об архитектуре защиты данных проекта GRUZ</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="52%" stop-color="#0a1729"/>
      <stop offset="100%" stop-color="#082c42"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1120" fill="#0e0e17"/>
  <circle cx="70" cy="980" r="330" fill="#7624d7" opacity=".16"/>
  <circle cx="1520" cy="1040" r="360" fill="#c56cff" opacity=".08"/>
  <circle cx="1420" cy="80" r="300" fill="#7c2cf4" opacity=".06"/>
  <rect x="48" y="48" width="1504" height="1024" rx="18" fill="none" stroke="#53515e" stroke-width="2"/>

  <!-- Header -->
  <g font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif">
    <rect x="88" y="80" width="84" height="84" rx="16" fill="#171720" stroke="#625d70"/>
    <text x="130" y="137" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">G</text>
    <text x="200" y="105" font-size="15" letter-spacing="2" fill="#92909e">ПРОЕКТ</text>
    <text x="200" y="145" font-size="24" font-weight="700" letter-spacing="2" fill="#ffffff">ГРУЗ · GRUZ</text>
    <text x="1450" y="103" text-anchor="end" font-size="14" letter-spacing="2" fill="#777582">SECURITY REPORT</text>
    <text x="1450" y="137" text-anchor="end" font-size="17" font-weight="700" fill="#d9d8df">30.06.2026 · FINAL</text>
    <line x1="88" y1="196" x2="1512" y2="196" stroke="#34333d"/>

    <text x="88" y="270" font-size="56" font-weight="700" fill="#ffffff">КОНТУР БЕЗОПАСНОСТИ</text>
    <text x="88" y="322" font-size="28" font-weight="600" fill="#d9d9dd">Чувствительные данные выведены из браузера</text>
    <text x="88" y="360" font-size="19" fill="#92919c">Финальная сводка по roadmap: авторизация, секреты, API, архив и CI/CD</text>

    <!-- Hero architecture -->
    <g>
      <rect x="88" y="408" width="1424" height="244" rx="18" fill="#11111b" stroke="#34333e" stroke-width="2"/>
      <rect x="444" y="527" width="118" height="5" rx="3" fill="#8a35f5"/>
      <polygon points="562,518 584,530 562,542" fill="#8a35f5"/>
      <rect x="1024" y="527" width="118" height="5" rx="3" fill="#8a35f5"/>
      <polygon points="1142,518 1164,530 1142,542" fill="#8a35f5"/>

      <g transform="translate(120 449)">
        <rect width="314" height="162" rx="14" fill="#171721" stroke="#3e3d49"/>
        <circle cx="48" cy="48" r="23" fill="#8332ed"/>
        <text x="48" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">01</text>
        <text x="82" y="44" font-size="14" letter-spacing="1" fill="#aaa8b2">ТОЧКА ВХОДА</text>
        <text x="82" y="72" font-size="21" font-weight="700" fill="#f4f7ff">VERCEL FRONTEND</text>
        <text x="28" y="112" font-size="15" fill="#c7c6cc">GitHub Pages → redirect</text>
        <text x="28" y="139" font-size="15" fill="#92919c">Единый production-домен</text>
      </g>

      <g transform="translate(586 449)">
        <rect width="428" height="162" rx="14" fill="#191422" stroke="#8735ed" stroke-width="2"/>
        <circle cx="51" cy="48" r="23" fill="#8a35f5"/>
        <text x="51" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">02</text>
        <text x="94" y="44" font-size="14" letter-spacing="1" fill="#bca8cf">ЗАЩИЩЕННЫЙ ШЛЮЗ</text>
        <text x="94" y="72" font-size="21" font-weight="700" fill="#f4f7ff">VERCEL SERVERLESS API</text>
        <text x="28" y="112" font-size="15" fill="#c7c6cc">Whitelist · CORS · validation</text>
        <text x="28" y="139" font-size="15" fill="#92919c">HttpOnly encrypted session</text>
      </g>

      <g transform="translate(1166 449)">
        <rect width="314" height="162" rx="14" fill="#171721" stroke="#3e3d49"/>
        <circle cx="59" cy="48" r="23" fill="#8332ed"/>
        <text x="59" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">03</text>
        <text x="105" y="44" font-size="14" letter-spacing="1" fill="#aaa8b2">PRIVATE DATA</text>
        <text x="105" y="72" font-size="21" font-weight="700" fill="#f4f7ff">GOOGLE DRIVE</text>
        <text x="28" y="112" font-size="15" fill="#c7c6cc">Рейсы · PDF · печать</text>
        <text x="28" y="139" font-size="15" fill="#92919c">Доступ только через backend</text>
      </g>
    </g>

    <!-- Four status cards -->
    <g transform="translate(88 690)">
      <g>
        <rect width="338" height="136" rx="16" fill="#15151f" stroke="#3a3945"/>
        <text x="24" y="42" font-size="27" font-weight="900" fill="#ffffff">SERVER-SIDE</text>
        <text x="24" y="75" font-size="13" letter-spacing="1" fill="#8f8d99">GOOGLE OAUTH</text>
        <circle cx="302" cy="40" r="14" fill="#8634ef"/>
        <circle cx="302" cy="40" r="5" fill="#f2eaff"/>
        <text x="24" y="108" font-size="13" fill="#c5c4ca">Token недоступен JavaScript</text>
      </g>
      <g transform="translate(362)">
        <rect width="338" height="136" rx="16" fill="#15151f" stroke="#3a3945"/>
        <text x="24" y="42" font-size="27" font-weight="900" fill="#ffffff">HTTPONLY</text>
        <text x="24" y="75" font-size="13" letter-spacing="1" fill="#8f8d99">SECURE SESSION</text>
        <circle cx="302" cy="40" r="14" fill="#8634ef"/>
        <circle cx="302" cy="40" r="5" fill="#f2eaff"/>
        <text x="24" y="108" font-size="13" fill="#c5c4ca">Encrypted · Secure · SameSite</text>
      </g>
      <g transform="translate(724)">
        <rect width="338" height="136" rx="16" fill="#15151f" stroke="#3a3945"/>
        <text x="24" y="42" font-size="27" font-weight="900" fill="#ffffff">PRIVATE ENV</text>
        <text x="24" y="75" font-size="13" letter-spacing="1" fill="#8f8d99">VERCEL SECRETS</text>
        <circle cx="302" cy="40" r="14" fill="#8634ef"/>
        <circle cx="302" cy="40" r="5" fill="#f2eaff"/>
        <text x="24" y="108" font-size="13" fill="#c5c4ca">Реквизиты вне Git и frontend</text>
      </g>
      <g transform="translate(1086)">
        <rect width="338" height="136" rx="16" fill="#15151f" stroke="#3a3945"/>
        <text x="24" y="42" font-size="27" font-weight="900" fill="#ffffff">CI GATE</text>
        <text x="24" y="75" font-size="13" letter-spacing="1" fill="#8f8d99">SECURITY BASELINE</text>
        <circle cx="302" cy="40" r="14" fill="#8634ef"/>
        <circle cx="302" cy="40" r="5" fill="#f2eaff"/>
        <text x="24" y="108" font-size="13" fill="#c5c4ca">Синтаксис · secrets · diff</text>
      </g>
    </g>

    <!-- Details -->
    <g transform="translate(88 858)">
      <rect width="1424" height="158" rx="18" fill="#14141e" stroke="#3a3945"/>
      <text x="28" y="35" font-size="14" letter-spacing="2" fill="#a96aff">ЗАЩИЩЕННЫЙ ПЕРИМЕТР</text>
      <line x1="475" y1="58" x2="475" y2="132" stroke="#2b2a34"/>
      <line x1="949" y1="58" x2="949" y2="132" stroke="#2b2a34"/>
      <g>
        <text x="28" y="78" font-size="13" font-weight="700" fill="#9d54fa">01 / ДАННЫЕ РЕЙСОВ</text>
        <text x="28" y="108" font-size="16" fill="#e2e1e5">Чтение и запись через API</text>
        <text x="28" y="132" font-size="14" fill="#93919c">Доступ проверяется на сервере</text>
      </g>
      <g>
        <text x="503" y="78" font-size="13" font-weight="700" fill="#9d54fa">02 / АРХИВ И PDF</text>
        <text x="503" y="108" font-size="16" fill="#e2e1e5">ID и файлы скрыты за backend</text>
        <text x="503" y="132" font-size="14" fill="#93919c">Печать выдаётся после whitelist</text>
      </g>
      <g>
        <text x="977" y="78" font-size="13" font-weight="700" fill="#9d54fa">03 / EMAIL</text>
        <text x="977" y="108" font-size="16" fill="#e2e1e5">Отправка выполняется сервером</text>
        <text x="977" y="132" font-size="14" fill="#93919c">Шаблоны удалены из frontend</text>
      </g>
    </g>

    <!-- Footer -->
    <line x1="88" y1="1036" x2="1512" y2="1036" stroke="#2b2a34"/>
    <text x="88" y="1058" font-size="12" letter-spacing="1.5" fill="#777582">FARAPATTON / GRUZ · DEFENSE IN DEPTH</text>
    <text x="1512" y="1058" text-anchor="end" font-size="13" fill="#8f8d99">Vercel · GitHub Actions · Google OAuth · Drive API</text>
  </g>
</svg>
