<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">GRUZ - финальная сводка по безопасности</title>
  <desc id="desc">Одностраничный отчет об архитектуре защиты данных проекта GRUZ</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="52%" stop-color="#0a1729"/>
      <stop offset="100%" stop-color="#082c42"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1120" fill="#0a2238"/>
  <circle cx="1460" cy="90" r="430" fill="#146184" opacity=".32"/>
  <circle cx="100" cy="1050" r="360" fill="#1a5278" opacity=".20"/>
  <rect x="48" y="48" width="1504" height="1024" rx="8" fill="none" stroke="#b98a35" stroke-opacity=".72" stroke-width="2"/>

  <!-- Header -->
  <g font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif">
    <rect x="88" y="80" width="84" height="84" rx="16" fill="#10283e" stroke="#e0b24f" stroke-opacity=".9"/>
    <text x="130" y="137" text-anchor="middle" font-size="40" font-weight="800" fill="#ffe4a0">G</text>
    <text x="200" y="105" font-size="15" letter-spacing="2" fill="#9fb2ca">ПРОЕКТ</text>
    <text x="200" y="145" font-size="24" font-weight="700" letter-spacing="2" fill="#f0c661">ГРУЗ · GRUZ</text>
    <text x="1450" y="103" text-anchor="end" font-size="14" letter-spacing="2" fill="#64728f">SECURITY REPORT</text>
    <text x="1450" y="137" text-anchor="end" font-size="17" font-weight="700" fill="#d7e1f5">30.06.2026 · FINAL</text>
    <line x1="88" y1="196" x2="1512" y2="196" stroke="#d1a347" stroke-opacity=".75"/>

    <text x="88" y="270" font-size="56" font-weight="700" fill="#f0c45c">КОНТУР БЕЗОПАСНОСТИ</text>
    <text x="88" y="322" font-size="28" font-weight="600" fill="#f3f7ff">Чувствительные данные выведены из браузера</text>
    <text x="88" y="360" font-size="19" fill="#a6b8ce">Финальная сводка по roadmap: авторизация, секреты, API, архив и CI/CD</text>

    <!-- Hero architecture -->
    <g>
      <rect x="88" y="408" width="1424" height="244" rx="18" fill="#0e3452" stroke="#4c7c9e" stroke-width="2"/>
      <rect x="444" y="527" width="118" height="6" rx="3" fill="#35ead7"/>
      <polygon points="562,518 584,530 562,542" fill="#35ead7"/>
      <rect x="1024" y="527" width="118" height="6" rx="3" fill="#35ead7"/>
      <polygon points="1142,518 1164,530 1142,542" fill="#35ead7"/>

      <g transform="translate(120 449)">
        <rect width="314" height="162" rx="14" fill="#124362" stroke="#5a89a8"/>
        <circle cx="48" cy="48" r="23" fill="#29ddce"/>
        <text x="48" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#062236">01</text>
        <text x="82" y="44" font-size="14" letter-spacing="1" fill="#91b9cc">ТОЧКА ВХОДА</text>
        <text x="82" y="72" font-size="21" font-weight="700" fill="#f4f7ff">VERCEL FRONTEND</text>
        <text x="28" y="112" font-size="15" fill="#b7c8da">GitHub Pages → redirect</text>
        <text x="28" y="139" font-size="15" fill="#b7c8da">Единый production-домен</text>
      </g>

      <g transform="translate(586 449)">
        <rect width="428" height="162" rx="14" fill="#105368" stroke="#35ead7" stroke-width="2"/>
        <circle cx="51" cy="48" r="23" fill="#29ddce"/>
        <text x="51" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#062236">02</text>
        <text x="94" y="44" font-size="14" letter-spacing="1" fill="#9bd4db">ЗАЩИЩЕННЫЙ ШЛЮЗ</text>
        <text x="94" y="72" font-size="21" font-weight="700" fill="#f4f7ff">VERCEL SERVERLESS API</text>
        <text x="28" y="112" font-size="15" fill="#c0d2df">Whitelist · CORS · validation</text>
        <text x="28" y="139" font-size="15" fill="#c0d2df">HttpOnly encrypted session</text>
      </g>

      <g transform="translate(1166 449)">
        <rect width="314" height="162" rx="14" fill="#124362" stroke="#5a89a8"/>
        <circle cx="59" cy="48" r="23" fill="#f0c45c"/>
        <text x="59" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#30230a">03</text>
        <text x="105" y="44" font-size="14" letter-spacing="1" fill="#c4a96e">PRIVATE DATA</text>
        <text x="105" y="72" font-size="21" font-weight="700" fill="#f4f7ff">GOOGLE DRIVE</text>
        <text x="28" y="112" font-size="15" fill="#b7c8da">Рейсы · PDF · печать</text>
        <text x="28" y="139" font-size="15" fill="#b7c8da">Доступ только через backend</text>
      </g>
    </g>

    <!-- Four status cards -->
    <g transform="translate(88 690)">
      <g>
        <rect width="338" height="136" rx="16" fill="#103b5d" stroke="#5783a1"/>
        <text x="24" y="42" font-size="27" font-weight="900" fill="#ffe5a1">SERVER-SIDE</text>
        <text x="24" y="75" font-size="13" letter-spacing="1" fill="#8795ae">GOOGLE OAUTH</text>
        <circle cx="302" cy="40" r="14" fill="#2ce4d2"/>
        <circle cx="302" cy="40" r="5" fill="#073044"/>
        <text x="24" y="108" font-size="13" fill="#a9bdd1">Token недоступен JavaScript</text>
      </g>
      <g transform="translate(362)">
        <rect width="338" height="136" rx="16" fill="#103b5d" stroke="#5783a1"/>
        <text x="24" y="42" font-size="27" font-weight="900" fill="#ffe5a1">HTTPONLY</text>
        <text x="24" y="75" font-size="13" letter-spacing="1" fill="#8795ae">SECURE SESSION</text>
        <circle cx="302" cy="40" r="14" fill="#2ce4d2"/>
        <circle cx="302" cy="40" r="5" fill="#073044"/>
        <text x="24" y="108" font-size="13" fill="#a9bdd1">Encrypted · Secure · SameSite</text>
      </g>
      <g transform="translate(724)">
        <rect width="338" height="136" rx="16" fill="#103b5d" stroke="#5783a1"/>
        <text x="24" y="42" font-size="27" font-weight="900" fill="#ffe5a1">PRIVATE ENV</text>
        <text x="24" y="75" font-size="13" letter-spacing="1" fill="#8795ae">VERCEL SECRETS</text>
        <circle cx="302" cy="40" r="14" fill="#2ce4d2"/>
        <circle cx="302" cy="40" r="5" fill="#073044"/>
        <text x="24" y="108" font-size="13" fill="#a9bdd1">Реквизиты вне Git и frontend</text>
      </g>
      <g transform="translate(1086)">
        <rect width="338" height="136" rx="16" fill="#103b5d" stroke="#5783a1"/>
        <text x="24" y="42" font-size="27" font-weight="900" fill="#ffe5a1">CI GATE</text>
        <text x="24" y="75" font-size="13" letter-spacing="1" fill="#8795ae">SECURITY BASELINE</text>
        <circle cx="302" cy="40" r="14" fill="#2ce4d2"/>
        <circle cx="302" cy="40" r="5" fill="#073044"/>
        <text x="24" y="108" font-size="13" fill="#a9bdd1">Синтаксис · secrets · diff</text>
      </g>
    </g>

    <!-- Details -->
    <g transform="translate(88 858)">
      <rect width="1424" height="158" rx="18" fill="#0e3654" stroke="#4b7898"/>
      <text x="28" y="35" font-size="14" letter-spacing="2" fill="#56d9d0">ЗАЩИЩЕННЫЙ ПЕРИМЕТР</text>
      <line x1="475" y1="58" x2="475" y2="132" stroke="#263b52"/>
      <line x1="949" y1="58" x2="949" y2="132" stroke="#263b52"/>
      <g>
        <text x="28" y="78" font-size="13" font-weight="700" fill="#36ddcf">01 / ДАННЫЕ РЕЙСОВ</text>
        <text x="28" y="108" font-size="16" fill="#c1ccdc">Чтение и запись через API</text>
        <text x="28" y="132" font-size="14" fill="#8291a8">Доступ проверяется на сервере</text>
      </g>
      <g>
        <text x="503" y="78" font-size="13" font-weight="700" fill="#36ddcf">02 / АРХИВ И PDF</text>
        <text x="503" y="108" font-size="16" fill="#c1ccdc">ID и файлы скрыты за backend</text>
        <text x="503" y="132" font-size="14" fill="#8291a8">Печать выдаётся после whitelist</text>
      </g>
      <g>
        <text x="977" y="78" font-size="13" font-weight="700" fill="#36ddcf">03 / EMAIL</text>
        <text x="977" y="108" font-size="16" fill="#c1ccdc">Отправка выполняется сервером</text>
        <text x="977" y="132" font-size="14" fill="#8291a8">Шаблоны удалены из frontend</text>
      </g>
    </g>

    <!-- Footer -->
    <line x1="88" y1="1036" x2="1512" y2="1036" stroke="#26324a"/>
    <text x="88" y="1058" font-size="12" letter-spacing="1.5" fill="#65738d">FARAPATTON / GRUZ · DEFENSE IN DEPTH</text>
    <text x="1512" y="1058" text-anchor="end" font-size="13" fill="#8996ab">Vercel · GitHub Actions · Google OAuth · Drive API</text>
  </g>
</svg>
